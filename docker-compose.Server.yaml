
services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 4123
      MYSQL_DATABASE: testdb
    ports:
      - "8078:3306"
    volumes:
      - db_data:/var/lib/mysql

  adminer:
    image: adminer
    container_name: adminer_app
    restart: always
    ports:
      - "8054:8080"
    depends_on:
      - db

volumes:
  db_data: